services:
  - type: web
    name: personal-finance-manager-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: personal-finance-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:5500
        # ⚠️ Après avoir déployé le frontend sur Vercel, reviens ici et remplace
        # cette valeur par l'URL Vercel réelle (ex: https://mon-projet.vercel.app)

databases:
  - name: personal-finance-db
    plan: free