services:
  - type: web
    name: personal-finance-manager-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: personal-finance-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:5500

databases:
  - name: personal-finance-db
    plan: free